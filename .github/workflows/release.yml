name: 构建与发布

# 触发方式
#   push 到 main / 对 main 的 PR   → 只构建 + 跑单元测试，不发 Release
#   push 形如 v1.2.3 的 tag        → 构建 + 发 Release，附 release 与 debug 两个可下载的 APK
#   手动 workflow_dispatch（可填 tag）→ 同上；tag 留空则只构建
#
# 为什么不给 pull_request 用密钥：公共仓库的 fork PR 本来就拿不到 secrets，这里再把
# 「不信任的代码 + 签名密钥」这个组合彻底排除掉。签名密钥只在 push/手动触发时才注入。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '发布成 Release 的 tag（如 v1.2.0）；留空则只构建'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      signed: ${{ steps.collect.outputs.signed }}
      sameKey: ${{ steps.collect.outputs.same_key }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install platform-tools 'platforms;android-36' 'build-tools;36.1.0'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 从 tag 推导版本号
        id: version
        run: |
          set -euo pipefail
          # tag 触发时用 tag，手动触发时用手填的，都没有就当成开发构建
          REF="${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag || '' }}"
          if [ -n "$REF" ]; then
            VER="${REF#v}"
            # 预发布后缀（-rc1 / -beta 等）：正式版必须比它的预发布版更新，所以减 1
            PRERELEASE=""
            case "$VER" in *-*) PRERELEASE="${VER#*-}" ;; esac
            BASE="${VER%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            MAJOR="${MAJOR//[^0-9]/}"; MINOR="${MINOR//[^0-9]/}"; PATCH="${PATCH//[^0-9]/}"
            # versionCode 必须单调递增，否则 Android 不认后一个包是「升级」
            CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
            if [ -n "$PRERELEASE" ]; then
              CODE=$(( CODE - 1 ))
              echo "预发布版 \"$PRERELEASE\"：versionCode 减 1，保证正式版 $VER 能盖过它"
            fi
          else
            VER="0.0.0-dev"
            CODE=1
          fi
          printf 'name=%s\ncode=%s\ntag=%s\n' "$VER" "$CODE" "$REF" >> "$GITHUB_OUTPUT"
          echo "versionName=$VER  versionCode=$CODE  tag=${REF:-（无）}"

      - name: 准备签名密钥（仅当仓库配置了 KEYSTORE_BASE64）
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "已写入 keystore.properties（内容不打印）；keystore 大小 $(wc -c < keystore/release.jks) 字节"

      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 构建 release 与 debug 两个 APK
        # -PsignDebugWithReleaseKey 在「没有密钥」时会被 build.gradle.kts 忽略，
        # 所以这里无条件传，少一层条件判断。
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease assembleDebug \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PsignDebugWithReleaseKey

      - name: 整理产物、校验签名、算校验和
        id: collect
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.name }}"
          mkdir -p dist
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SIGNED=yes
            OUT_RELEASE="dist/WorkoutTracker-${VER}-release-signed.apk"
            cp app/build/outputs/apk/release/app-release.apk "$OUT_RELEASE"
          else
            SIGNED=no
            OUT_RELEASE="dist/WorkoutTracker-${VER}-release-unsigned.apk"
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$OUT_RELEASE"
            echo "::warning::release APK 未签名（仓库未配置 KEYSTORE_BASE64），它装不上，只能作为产物存档"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/WorkoutTracker-${VER}-debug.apk"

          # 找 apksigner：Linux runner 上是 shell 版，Windows SDK 里只有 .bat
          # 找不到就报错中止 —— “验不了签名”不能默默变成“没有签名”的结论
          APKSIGNER=""
          for cand in "$BT/apksigner" "$BT/apksigner.bat"; do
            if [ -f "$cand" ]; then APKSIGNER="$cand"; break; fi
          done
          if [ -z "$APKSIGNER" ]; then
            echo "::error::在 $BT 里找不到 apksigner，无法校验签名，中止以免发布误导性的说明"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"

          # 用证书指纹判断两个包是不是同一签名：同一签名才能互相覆盖安装而不丢数据。
          # 重试是必要的：实测（Windows + 杀软/文件索引）刚写出的 APK 会被短暂占用，
          # apksigner 读不到就退出 1 —— 那会让「验不了」被误当成「未签名」，讲出与事实相反的话。
          # 取证书指纹。两条规矩都是踩过坑后定的：
          #   1) 绝不丢掉 apksigner 的输出 —— 环境问题（比如 JAVA_HOME 给成了 POSIX 路径，
          #      Windows 的 .bat 读不了）曾经因为 2>/dev/null 而被误读成「包没签名」，
          #      于是 Release 说明写出了与事实相反的话；
          #   2) 用「变量是否为空」配合响亮的失败，而不是默认「空 = 未签名」。
          VERIFY_OUT="$(mktemp)"
          digest() {
            "$APKSIGNER" verify --print-certs "$1" > "$VERIFY_OUT" 2>&1 || true
            grep -o 'SHA-256 digest: [0-9a-f]*' "$VERIFY_OUT" | head -1 || true
          }
          REL_DIGEST="$(digest "$OUT_RELEASE")"
          DBG_DIGEST="$(digest "dist/WorkoutTracker-${VER}-debug.apk")"
          if [ -z "$DBG_DIGEST" ]; then
            echo "apksigner 对 debug 包的原始输出："
            cat "$VERIFY_OUT" 2>/dev/null || true
            echo "::error::debug 包拿不到证书指纹，中止（不把「验不了」当成「未签名」）"
            exit 1
          fi
          if [ "$SIGNED" = yes ] && [ -z "$REL_DIGEST" ]; then
            echo "apksigner 对 release 包的原始输出："
            cat "$VERIFY_OUT" 2>/dev/null || true
            echo "::error::release 包已签名却拿不到指纹，中止以免发布错误结论"
            exit 1
          fi
          rm -f "$VERIFY_OUT"
          if [ -n "$REL_DIGEST" ] && [ "$REL_DIGEST" = "$DBG_DIGEST" ]; then SAME=yes; else SAME=no; fi
          echo "release: $OUT_RELEASE  ${REL_DIGEST:-（无签名）}"
          echo "debug  : dist/WorkoutTracker-${VER}-debug.apk  ${DBG_DIGEST:-（无签名）}"
          echo "两包同一签名: $SAME"

          (cd dist && sha256sum *.apk | tee SHA256SUMS.txt)
          printf 'signed=%s\nsame_key=%s\n' "$SIGNED" "$SAME" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VER: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
          SIGNED: ${{ needs.build.outputs.signed }}
          SAME_KEY: ${{ needs.build.outputs.sameKey }}
        run: |
          set -euo pipefail

          if [ "$SIGNED" = yes ]; then
            RELEASE_FILE="WorkoutTracker-${VER}-release-signed.apk"
            RELEASE_DESC="正式包，已用正式密钥签名 —— 日常用这个"
            INSTALL_BLOCK="\`\`\`bash
          adb install -r ${RELEASE_FILE}
          \`\`\`"
          else
            RELEASE_FILE="WorkoutTracker-${VER}-release-unsigned.apk"
            RELEASE_DESC="**未签名**，Android 直接拒装，只能作为构建产物存档"
            INSTALL_BLOCK="\`\`\`bash
          adb install -r WorkoutTracker-${VER}-debug.apk   # 只有这个装得上
          \`\`\`"
          fi

          if [ "$SAME_KEY" = yes ]; then
            SIGN_LINES="两个包都用正式密钥签名，且**同一签名** —— 可以互相覆盖安装，运动记录不会丢。"
            DEBUG_DESC="调试包，与正式包同一签名（多一个可调试标记，装它可以直接看 logcat）"
          else
            DEBUG_DESC="调试包，CI 临时签名，**与正式包不同** —— 换装要先卸载，运动记录会丢"
            if [ "$SIGNED" = yes ]; then
              SIGN_LINES="release 包用正式密钥签名；debug 包是 CI 临时签名，两者不能互相覆盖。"
            else
              SIGN_LINES="⚠️ 仓库还没配置签名密钥（KEYSTORE_BASE64）：下面这个 release 包装不上，能装的只有 debug 包，但它是 CI 临时签名，跨版本安装要先卸载（记录会丢）。"
            fi
          fi

          cat > notes.md <<EOF
          ## 每日运动 ${VER}

          ${SIGN_LINES}

          | 文件 | 说明 |
          | --- | --- |
          | \`${RELEASE_FILE}\` | ${RELEASE_DESC} |
          | \`WorkoutTracker-${VER}-debug.apk\` | ${DEBUG_DESC} |
          | \`SHA256SUMS.txt\` | 两个包的 SHA-256 |

          安装：

          ${INSTALL_BLOCK}

          - 包名 \`dev.sopho.workout\`，minSdk 26，targetSdk 36，零权限、不联网
          - 版本由 tag 推导：\`${TAG}\` → versionName \`${VER}\` / versionCode \`${CODE}\`
          - 本次构建的提交：\`${GITHUB_SHA}\`
          EOF

          echo "=== 待发布文件 ==="
          ls -la

          # tag 触发时 tag 一定已存在，不能传 --target；手动触发时 tag 可能还不存在，交给 gh 创建
          # release job 里没有 checkout，工作目录里没有 .git —— gh 不带 --repo 时会去读本地 git
          # 推断仓库，直接报 “failed to run git: not a git repository”（第一次真跑就栽在这里）。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md WorkoutTracker-*.apk SHA256SUMS.txt
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" \
              WorkoutTracker-*.apk SHA256SUMS.txt \
              || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md WorkoutTracker-*.apk SHA256SUMS.txt
          fi
